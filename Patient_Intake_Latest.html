<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patient intake: upload, review, qualify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F3F9FD; --line:#E1DFDD; --line-strong:#C8C6C4;
  --ink:#07426F; --text:#201F1E; --label:#323130; --muted:#605E5C;
  --btn:#0078D4; --btn-hover:#106EBE; --link:#0078D4; --blue-soft:#F3F9FD; --blue-line:#ABD1EE; --badge:#E6F2FB; --icon-bg:#D1E6F6;
  --amber:#D29200; --amber-dot:#D29200; --amber-line:#D29200;
  --red:#D13438; --red-dot:#D13438; --red-line:#D13438;
  --green:#107C10; --focus:#0078D4;
  --head-h:56px;
  color-scheme:light only;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);scroll-padding-bottom:120px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* app header + stepper */
.app-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-height:var(--head-h);background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand{font-weight:700;color:var(--ink);font-size:15px}
.steps{display:flex;align-items:center;gap:4px}
.step{display:inline-flex;gap:8px;align-items:center;background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:2px}
.step:hover{background:var(--sunken)}
.step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface)}
.step .n .ic{width:13px;height:13px}
.step[aria-current="step"]{color:var(--ink);font-weight:600}
.step[aria-current="step"] .n{background:var(--btn);border-color:var(--btn);color:#fff}
.step.done{color:var(--text)}
.step.done .n{background:var(--badge);border-color:var(--blue-line);color:var(--ink)}
.step-sep{width:22px;height:1px;background:var(--line-strong)}
.head-r{display:flex;justify-content:flex-end}

.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 72px}
.wrap.has-foot{padding-bottom:120px}
.col{max-width:760px;margin:0 auto}

/* buttons */
.btn{border-radius:2px;padding:8px 14px;border:1px solid transparent;cursor:pointer;display:inline-flex;gap:6px;align-items:center;line-height:1.2;min-height:36px;font-weight:500;background:none;color:var(--text);text-decoration:none}
.btn.primary{background:var(--btn);color:#fff}
.btn.primary:hover{background:var(--btn-hover)}
.btn.primary:disabled{background:var(--line-strong);color:var(--muted);cursor:not-allowed}
.btn.secondary{background:var(--surface);border-color:#8A8886;color:var(--text)}
.btn.secondary:hover{background:#F3F2F1}
.btn.secondary[aria-pressed="true"]{background:var(--badge);border-color:var(--blue-line);color:var(--ink)}
.btn.ghost{color:var(--link)}
.btn.ghost:hover{background:var(--badge)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}

/* headings */
.page-head{margin:8px 0 18px}
.page-head.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.h1{margin:0 0 4px;font-size:21px;line-height:1.3;color:var(--ink);font-weight:700}
.lead{color:var(--muted);margin:0;max-width:62ch}

/* banner */
.banner{display:flex;gap:16px;align-items:center;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:4px;padding:16px 20px;margin:0 0 16px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.b-icon{width:40px;height:40px;border-radius:50%;background:var(--icon-bg);color:var(--link);display:grid;place-items:center;flex:none}
.b-icon .ic{width:20px;height:20px}
.b-text{flex:1 1 300px}
.banner h1{margin:0 0 2px;font-size:19px;line-height:1.3;color:var(--link);font-weight:600}
.banner p{margin:0;color:var(--muted);max-width:62ch}
.badge{display:inline-block;background:var(--badge);color:var(--ink);border-radius:4px;padding:2px 10px;font-size:12px;font-weight:500;margin-bottom:6px}
.b-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.b-hint{font-size:12.5px;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.card + .card{margin-top:16px}
.card-head{padding:12px 20px;background:var(--sunken);border-bottom:1px solid var(--line);border-radius:3px 3px 0 0}
.card-head h2{font-size:15px;margin:0;color:var(--ink);font-weight:700}
.card-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pad{padding:24px}

/* upload */
.drop{border:1px dashed var(--line-strong);background:var(--sunken);border-radius:4px;padding:32px 20px;text-align:center;display:grid;gap:6px;justify-items:center}
.drop.over{border-color:var(--btn);background:var(--badge)}
.drop .ic-big{width:40px;height:40px;border-radius:50%;background:var(--icon-bg);color:var(--link);display:grid;place-items:center;margin-bottom:4px}
.drop .ic-big .ic{width:20px;height:20px}
.drop-t{font-weight:600;color:var(--ink);font-size:15px}
.drop-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.files{list-style:none;margin:0;padding:0}
.file{display:flex;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .ic{color:var(--link)}
.f-main{flex:1;min-width:0;display:grid}
.f-name{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-meta{font-size:12.5px;color:var(--muted)}
.up-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.read-list{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.read-list li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.read-list li.done{color:var(--text)}
.read-list li.done .ic{color:var(--green)}
.read-list li.now{color:var(--ink);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue-line);border-top-color:var(--btn);animation:sp .8s linear infinite;flex:none}
.pend{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-strong);flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* inputs */
.in{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:2px;padding:9px 11px;min-height:38px}
.in:hover{border-color:#8A8886}
.in:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.in::placeholder{color:#A19F9D}
textarea.in{min-height:120px;resize:vertical;line-height:1.55}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:34px}
.sel .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.lrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:5px;min-height:20px;flex-wrap:wrap}
.field label{display:block;font-size:13px;color:var(--label);margin:0;font-weight:500}
.lk{background:none;border:0;color:var(--link);cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;gap:3px;align-items:center;padding:0 2px;border-radius:2px;white-space:nowrap}
.lk .ic{width:13px;height:13px}
.lk:hover{text-decoration:underline}
.req{color:var(--muted)}
.field.low .in{border-color:var(--amber-line)}
.field.missing .in{border-color:var(--red-line)}
.hint{font-size:12.5px;margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
.hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint:empty{display:none}
.hint .ic{width:14px;height:14px}
.field.low .hint{color:var(--amber)}
.field.missing .hint{color:var(--red)}
.hint .btn{padding:2px 8px;min-height:24px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.amber{background:var(--amber-dot)}
.dot.red{background:var(--red-dot)}

/* review layout */
.strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h));z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px 8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin:0 0 16px;font-size:13px;flex-wrap:wrap}
.strip.ok .l{color:var(--muted);display:flex;gap:8px;align-items:center}
.strip.ok .l .ic{color:var(--green)}
.strip .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.strip-act{display:flex;gap:4px}
.rev-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.rev-grid.nopanel{grid-template-columns:minmax(0,880px);justify-content:center}
.secs{overflow:hidden}
details.sec{border-top:1px solid var(--line)}
details.sec:first-child{border-top:0}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer;background:var(--sunken)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--badge)}
.s-title{flex:1;font-weight:700;color:var(--ink)}
.s-status{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.s-status.amber{color:var(--amber)}
.s-status.red{color:var(--red)}
.s-status.green{color:var(--muted)}
.s-status.green .ic{color:var(--green);width:15px;height:15px}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(180deg)}
.s-body{padding:18px 20px 22px}
.sub{font-weight:600;color:var(--ink);font-size:13.5px;margin:22px 0 10px}
.sub:first-child{margin-top:0}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:3px;gap:2px;flex-wrap:wrap;margin-bottom:4px}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 12px;border-radius:2px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line-strong)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--text)}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:15px;line-height:1}
.chipbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line-strong);border-radius:2px;padding:6px 8px;background:var(--surface);min-height:38px}
.chipbox:focus-within{outline:2px solid var(--focus);border-color:var(--focus)}
.chip-in{border:0;background:transparent;font:inherit;color:var(--text);flex:1 1 120px;min-width:0;padding:4px;outline:none}
.note{display:flex;gap:7px;align-items:flex-start;color:var(--muted);font-size:13px;margin-top:8px}
.note .ic{color:var(--amber-dot);width:15px;height:15px;margin-top:2px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:8px}
.hrow b{color:var(--ink)}
.sm-t{font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;border-radius:4px;padding:1px 9px;background:var(--badge);color:var(--ink);border:1px solid var(--blue-line);white-space:nowrap}

/* sticky review footer */
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(0,0,0,.08);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{position:relative;max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl-btn{display:inline-flex;gap:8px;align-items:center;background:var(--sunken);border:1px solid var(--line);border-radius:2px;padding:6px 10px;cursor:pointer;color:var(--text);min-height:34px}
.fl-btn:hover{background:var(--badge)}
.fl-btn b{color:var(--ink)}
.fl-btn .chev{width:16px;height:16px;transform:rotate(180deg)}
.fl-btn[aria-expanded="true"] .chev{transform:none}
.fl-ok{display:inline-flex;gap:8px;align-items:center;color:var(--muted)}
.fl-ok .ic{color:var(--green)}
.rlist{position:absolute;left:0;bottom:calc(100% + 14px);width:min(440px,calc(100vw - 28px));max-height:min(52vh,420px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:6px}
.rl-h{padding:8px 10px 6px;font-weight:700;color:var(--ink)}
.rl-i{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:2px;cursor:pointer;color:var(--text)}
.rl-i:hover{background:var(--sunken)}
.rl-main{flex:1;display:grid;min-width:0}
.rl-main b{color:var(--ink);font-weight:600}
.rl-main span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-sec{color:var(--muted);font-size:12px;white-space:nowrap}

/* source document panel */
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h) + 16px)}
.doc-card{overflow:hidden}
.doc-head{background:#F9FAFB;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.doc-pick{flex:1;min-width:0}
.doc-pick .in{font-weight:600;color:var(--ink);padding:6px 11px;min-height:34px}
.doc-meta{font-size:12px;color:var(--muted);margin-top:4px}
.doc-stage{background:#FAF9F8;padding:16px;max-height:calc(100vh - 330px);overflow:auto}
.doc-note{padding:11px 16px;font-size:13px;color:var(--muted);border-top:1px solid #E5E7EB;background:#F9FAFB}
.doc-note.hit{color:var(--ink)}
.paper-img{position:relative;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.paper-img img{display:block;width:100%;height:auto}
.ov{position:absolute;pointer-events:none;border-radius:4px}
.paper{background:#FBFAF6;color:#1d2530;border-radius:2px;padding:18px;font-size:12.5px;line-height:1.55;border:1px solid #d9dde3}
.mk-h{font-weight:700;font-size:15px}
.mk-s{color:#5b6672;margin-bottom:10px}
.mk-g{font-weight:700;margin:14px 0 4px;padding-bottom:3px;border-bottom:1px solid #b9c0c8}
.mk-r{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:3px 0;border-bottom:1px dotted #cfd4da}
.mk-r>span:first-child{color:#5b6672}
.mk-blank{display:inline-block;min-width:130px;height:16px;border-bottom:1px solid #8c96a1}
.mk-card{border:1px solid #b9c0c8;border-radius:4px;padding:8px 10px;margin-bottom:10px;display:grid;gap:1px}
.mk-ct{font-weight:700}
.mk-p{padding:6px 0}
.mk-card[data-d],.mk-p[data-d]{margin-left:0;margin-right:0}
[data-d]{border-radius:3px;padding:0 2px;margin:0 -2px;transition:background-color .2s,box-shadow .2s}
.mk-card[data-d],.mk-p[data-d]{padding:8px 10px}
.mk-p[data-d]{padding:6px 8px}
[data-d].hl,.ov.hl{background:rgba(255,200,60,.4);box-shadow:0 0 0 2px rgba(210,146,0,.95)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(32,31,30,.32);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:31;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto;box-shadow:-6px 0 18px rgba(0,0,0,.12)}
.drawer .doc-stage{max-height:calc(100vh - 220px)}
.scrim[hidden],.drawer[hidden]{display:none}

/* qualification */
.vsum{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--sunken);border:1px solid var(--line);border-radius:4px}
.vsum .lbl{font-size:12.5px;color:var(--muted)}
.vsum .who{font-weight:600;color:var(--text)}
.stats{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px}
.stat{min-width:88px;padding:2px 12px;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .lbl{display:block}
.stat b{font-size:17px;color:var(--ink)}
.note-banner{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:4px;padding:10px 14px;margin:14px 0 18px;color:var(--ink)}
.note-banner .ic{color:var(--link);margin-top:3px}
.vet-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.vlist{padding:16px}
.vlist h2{margin:0 0 4px;font-size:15px;color:var(--ink);font-weight:700;display:flex;gap:8px;align-items:center}
.cnt{background:var(--btn);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:18px;font-weight:600}
.rxg{margin-top:16px}
.rxg-h{font-weight:700;color:var(--ink)}
.rxg-s{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.rxg-s .pecos{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.rxg-s .pecos .ic{width:13px;height:13px;color:var(--green)}
.vitem{display:grid;gap:2px;width:100%;text-align:left;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:10px 12px;margin-top:8px;cursor:pointer;color:var(--text)}
.vitem:hover{background:#FAFAFA}
.vitem[aria-current="true"]{background:var(--blue-soft);border-color:var(--blue-line)}
.vi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vi-top b{color:var(--ink)}
.vi-n{color:var(--muted);font-size:13px}
.vi-c{color:var(--muted);font-size:12.5px}
.tagx{font-size:12px;border-radius:4px;padding:1px 9px;white-space:nowrap;font-weight:500}
.tagx.review{background:#FFF4CE;color:#8A6100}
.tagx.pass{background:#DFF6DD;color:#107C10}
.tagx.fail{background:#FDE7E9;color:#A4262C}
.v-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--sunken);border-bottom:1px solid var(--line);border-radius:3px 3px 0 0;flex-wrap:wrap}
.v-head .t{font-weight:700;color:var(--ink)}
.v-head .r{display:flex;gap:8px;align-items:center}
details.crit{border-top:1px solid var(--line)}
details.crit:first-of-type{border-top:0}
.crit>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.crit>summary::-webkit-details-marker{display:none}
.crit>summary:hover{background:#FAFAFA}
.c-ic{width:20px;height:20px;flex:none}
.c-ic.ok{color:var(--green)}.c-ic.warn{color:var(--amber)}.c-ic.fail{color:var(--red)}
.c-main{flex:1;min-width:0;display:grid}
.c-title{font-weight:600;color:var(--ink)}
.c-sum{color:var(--muted);font-size:13px}
.c-body{padding:2px 16px 18px 48px}
.c-body p.plain{margin:0 0 4px;max-width:70ch}
.c-body h4{margin:16px 0 6px;font-size:13px;color:var(--muted);font-weight:500}

<body>
<header class="app-head">
  <div class="brand">Patient intake</div>
  <nav class="steps" id="steps" aria-label="Progress"></nav>
  <div class="head-r"><button class="btn secondary sm" data-act="openSrc" id="srcBtn"></button></div>
</header>
<main class="wrap" id="app"></main>
<div class="scrim" id="scrim" hidden data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-label="Source documents"><div id="drawerBody"></div></aside>
<div class="modal-scrim" id="modal" hidden></div>
<div class="srcpop" id="srcpop" role="dialog" aria-label="Where this was extracted from" hidden></div>

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(L.open&&!e.target.closest('.rlist,[data-act="toggleList"]')){L.open=false;refreshFlags();}
  if(e.target.id==='modal'){closeModal();return;}
  if(!e.target.closest('#srcpop,[data-src]'))hideSrc();
  const t=e.target.closest('[data-flag],[data-go],[data-act],[data-sel],[data-open],[data-expand],[data-updoc],[data-prev],[data-rmfile],[data-step],[data-confirm],[data-plan-tab],[data-rx-tab],[data-rm-icd],[data-src],[data-srcgo],[data-xopen],[data-xtoggle],[data-xrun],[data-elig],[data-rec],[data-nav]');
  if(!t)return;
  const d=t.dataset;
  if(d.src!==undefined){showSrc(t);return;}
  if(d.srcgo){const p=d.srcgo,fl=FLAGS.find(x=>x.path===p),[doc,key]=srcFor(p);hideSrc();openDoc(doc,key,!!fl&&fl.kind==='missing'&&!String(get(p)||'').trim());return;}
  if(d.xopen!==undefined){hideSrc();openX();return;}
  if(d.xtoggle!==undefined){X.open=!X.open;const x=$('#xsec');if(x)x.classList.toggle('open',X.open);const c=$('.doc-card');if(c)c.classList.toggle('xopen',X.open);t.setAttribute('aria-expanded',X.open);return;}
  if(d.xrun!==undefined){runExtract();return;}
  if(d.rec){const on=!RECSET.has(d.rec);on?RECSET.add(d.rec):RECSET.delete(d.rec);t.setAttribute('aria-pressed',on);t.innerHTML=on?ic('check')+' Added':'Add';const c=$('#recCnt');if(c)c.textContent=RECSET.size+' added';return;}
  if(d.nav){
    const cur=STEPS.findIndex(x=>x.k===view),n=+d.nav;
    if(n<0&&cur>0)go(STEPS[cur-1].k);
    else if(n>0){if(view==='upload'){if(FILES.length&&!U.reading)startReading();}else if(view==='review'&&!openFlags().some(f=>f.kind==='missing'))openDone();}
    return;
  }
  if(d.elig!==undefined){const i=+d.elig;E.elig[i]='busy';renderSection('insurance');refreshFlags();setTimeout(()=>{E.elig[i]=ELIG[i];if(view==='review'){renderSection('insurance');refreshFlags();}},1200);return;}
  if(d.flag){L.open=false;gotoFlag(FLAGS.find(f=>f.id===d.flag));return;}
  if(d.go){go(d.go);return;}
  if(d.act){
    switch(d.act){
      case 'sample':SAMPLES.forEach(s=>{if(!FILES.some(f=>f.name===s.name))FILES.push({...s});});renderUpload();break;
      case 'read':startReading();break;
      case 'toVet':openDone();break;
      case 'createOrder':toast('Order created.');break;
      case 'openSrc':if(view==='review')setPanel(!D.panel);else{openDoc(D.doc,'');}break;
      case 'toggleSrc':setPanel(!D.panel);break;
      case 'doneVet':closeModal();go('vet');break;
      case 'doneRefill':closeModal();toast('Refill order started for A7030 Full face mask interface.');break;
      case 'doneSkip':closeModal();toast('Order created. Vetting was skipped.');break;
      case 'closeModal':closeModal();break;
      case 'toggleList':L.open=!L.open;refreshFlags();break;
      case 'closeDrawer':closeDrawer();break;
    }
    return;
  }
  if(d.sel){V.sel=d.sel;renderVet();return;}
  if(d.open!==undefined){const [doc,key]=d.open.split(',');openDoc(doc,key,false);return;}
  if(d.expand!==undefined){
    document.querySelectorAll('details.crit').forEach(x=>{DS[x.dataset.k]=d.expand==='1';});
    renderVet();return;
  }
  if(d.updoc){const [id,i]=d.updoc.split(',');ITEMS.find(x=>x.id===id).docs[+i].ok=true;renderVet();toast('Document added.');return;}
  if(d.prev!==undefined){
    const f=FILES[+d.prev];
    if(!f.extra)openDoc(f.doc,'');
    else if(f.img)openDoc(f.doc,'');
    else toast("Preview isn't available for this file type in the prototype.");
    return;
  }
  if(d.rmfile!==undefined){FILES.splice(+d.rmfile,1);renderUpload();return;}
  if(d.step){
    const o=openFlags();if(!o.length)return;
    E.cursor=((E.cursor+(+d.step))%o.length+o.length)%o.length;
    gotoFlag(o[E.cursor]);return;
  }
  if(d.confirm){resolved.add(d.confirm);refreshFlags();return;}
  if(d.planTab!==undefined){E.plan=+d.planTab;renderSection('insurance');refreshFlags();return;}
  if(d.rxTab!==undefined){E.rx=+d.rxTab;renderSection('rx');refreshFlags();return;}
  if(d.rmIcd){const [r,k]=d.rmIcd.split(',').map(Number);S.rx[r].icd.splice(k,1);renderSection('rx');refreshFlags();return;}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.path){
    set(el.dataset.path,el.value);delete FRESH[el.dataset.path];
    const fl=FLAGS.find(f=>f.path===el.dataset.path);
    if(fl&&fl.kind==='low')resolved.add(fl.id);
    refreshFlags();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('xchk')){el.checked?X.sel.add(el.value):X.sel.delete(el.value);paintX();return;}
  if(el.id==='docsel'){D.doc=el.value;D.key='';D.missing=false;fillDoc();return;}
  if(el.id==='fileIn'){addFiles(el.files);}
});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(e.key==='Escape'){hideSrc();if(!$('#modal').hidden){closeModal();return;}}
  if(el.dataset&&el.dataset.grip!==undefined&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();const pos=+el.closest('.pl').dataset.pos,to=pos+(e.key==='ArrowUp'?-1:1);
    if(to>=0&&to<S.order.length){moveRank(pos,to);const g=document.querySelector(`.pl[data-pos="${to}"] [data-grip]`);if(g)g.focus();}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&el.classList&&el.classList.contains('pl')){e.preventDefault();E.plan=+el.dataset.planTab;renderSection('insurance');refreshFlags();return;}
  if(e.key==='Escape'&&L.open){L.open=false;refreshFlags();return;}
  if(e.key==='Escape'&&!$('#drawer').hidden){closeDrawer();return;}
  if(el.dataset&&el.dataset.icdAdd!==undefined&&e.key==='Enter'){
    e.preventDefault();
    const v=el.value.trim();if(!v)return;
    S.rx[+el.dataset.icdAdd].icd.push(v);
    renderSection('rx');refreshFlags();
  }
});
document.addEventListener('focusin',e=>{
  if(view!=='review')return;
  const el=e.target.closest&&e.target.closest('[data-path]');
  if(!el)return;
  const [doc,key]=srcFor(el.dataset.path);
  D.doc=doc;D.key=key;D.missing=el.dataset.missing==='1';
  if(D.panel)fillDoc();
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{if(view==='upload'&&e.target.closest&&e.target.closest('#drop')){e.preventDefault();$('#drop').classList.add('over');}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{if(view==='upload'&&e.target.closest&&e.target.closest('#drop')){e.preventDefault();const d=$('#drop');if(d)d.classList.remove('over');if(ev==='drop'&&e.dataTransfer)addFiles(e.dataTransfer.files);}}));

function xsecHTML(){

  if(!p.length)return `<div class="xsec"><div class="xhead static">${ic('check')}<span>All ${tot} documents on file have been read</span></div></div>`;

function paintX(){
  const b=$('#xBtn');if(!b)return;const n=X.sel.size;
  b.disabled=!n||X.busy;
  b.innerHTML=X.busy?`<span class="spin"></span> Reading ${n} ${n>1?'documents':'document'}`:n?`Extract from ${n} selected`:'Select documents';
  const c=$('#xcnt');if(c)c.textContent=X.busy?'':`${XDOCS.filter(d=>!d.done).length} unread`;
}
function openX(){
  X.open=true;
  if(!D.panel)setPanel(true);else fillDoc();

function runExtract(){
  const ks=[...X.sel];if(!ks.length||X.busy)return;
  X.busy=true;paintX();
  setTimeout(()=>{
    let n=0,first=null;
    ks.forEach(k=>{
      const x=XDOCS.find(d=>d.k===k);x.done=true;DOCS[k]={name:x.name,meta:`${x.type}, uploaded ${x.up}`};
      x.fills.forEach(f=>{
        if(!f.flag&&String(get(f.path)||'').trim())return;
        set(f.path,f.val);if(f.flag)resolved.add(f.flag);
        FRESH[f.path]=x.name;SRCO[f.path]=[k,f.key];n++;if(!first)first={k,key:f.key};
      });
    });
    X.sel.clear();X.busy=false;
    NAV.forEach(nv=>renderSection(nv.k));refreshFlags();
    toast(`Read ${ks.length} ${ks.length>1?'documents':'document'}. ${n} ${n===1?'detail':'details'} filled in.`);
    if(first)openDoc(first.k,first.key,false);else fillDoc();
  },1100);
}
/* source tooltip */
function showSrc(btn){
  const pop=$('#srcpop'),path=btn.dataset.src;
  if(!pop.hidden&&pop.dataset.for===path){hideSrc();return;}
  const fl=FLAGS.find(x=>x.path===path),miss=!!fl&&fl.kind==='missing'&&!String(get(path)||'').trim();
  const [doc]=srcFor(path),d=DOCS[doc]||{name:'the source document'};
  pop.innerHTML=miss
    ?`<div class="sp-line">Not found in the documents read.</div><button class="sp-ln" data-xopen>Read other documents</button>`
    :`<div class="sp-line">From <b>${esc(d.name)}</b></div><button class="sp-ln" data-srcgo="${path}">View source</button>`;
  pop.dataset.for=path;pop.hidden=false;
  document.querySelectorAll('.srcb').forEach(x=>x.setAttribute('aria-expanded',x===btn));
  const r=btn.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let left=Math.min(Math.max(8,r.left-12),innerWidth-w-8),top=r.bottom+6;
  if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function hideSrc(){const p=$('#srcpop');if(p){p.hidden=true;p.dataset.for='';}document.querySelectorAll('.srcb[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));}
window.addEventListener('scroll',hideSrc,true);
/* insurance priority: drag (pointer, works on touch) or arrow keys on the handle */
function moveRank(from,to){
  const [v]=S.order.splice(from,1);S.order.splice(to,0,v);
  renderSection('insurance');refreshFlags();
  toast(`${S.plans[v].name} is now ${RANK[to]||'#'+(to+1)}.`);

let DR=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;
  const item=g.closest('.pl');e.preventDefault();
  DR={item,list:item.parentNode,from:+item.dataset.pos,to:+item.dataset.pos,y0:e.clientY};
  g.setPointerCapture(e.pointerId);item.classList.add('drag');
});
document.addEventListener('pointermove',e=>{
  if(!DR)return;
  DR.item.style.transform=`translateY(${e.clientY-DR.y0}px)`;
  const others=[...DR.list.children].filter(x=>x!==DR.item);let to=0;
  others.forEach(x=>{const r=x.getBoundingClientRect();if(e.clientY>r.top+r.height/2)to++;});
  DR.to=to;others.forEach((x,i)=>{x.classList.toggle('ins-before',i===to);x.classList.toggle('ins-end',to===others.length&&i===others.length-1);});
});
function endDrag(){
  if(!DR)return;const {from,to}=DR;DR=null;
  if(from!==to)moveRank(from,to);else{renderSection('insurance');refreshFlags();}
}

function vetReason(it){
  const f=CRIT_ORDER.find(k=>cState(it,k)==='fail');if(f)return cText(it,f);
  if(cState(it,'docs')!=='ok')return 'documents missing, '+cText(it,'docs');
  const w=CRIT_ORDER.find(k=>cState(it,k)==='warn');return w?cText(it,w):'';
}
function vetAI(cnt){
  const bad=ITEMS.filter(i=>itemStatus(i)!=='pass');
  const list=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  const names=a=>a.map(r=>r.name.toLowerCase().replace('cpap','CPAP')+(r.code?' ('+r.code+')':''));
  const added=REC.filter(r=>RECSET.has(r.id)),left=REC.filter(r=>!RECSET.has(r.id));
  const dme=a=>names(a.filter(r=>r.k==='dme')),svc=a=>names(a.filter(r=>r.k==='svc'));
  const recTxt=(a,lead)=>a.length?`${lead} ${[dme(a).length?'DME: '+list(dme(a))+'.':'',svc(a).length?'Services: '+list(svc(a))+'.':''].filter(Boolean).join(' ')}`:'';
  return `<section class="m-sum vet-sum"><span class="badge">${ic('spark')} AI summary</span>
    <p>${esc(S.first)}'s order has ${cnt.total} items under ${esc(S.plans[S.order[0]].name)}. <b>${cnt.q}</b> qualify, <b>${cnt.n}</b> need review and <b>${cnt.f}</b> do not qualify.${bad.length?` Needs attention: ${bad.map(i=>`${esc(i.code)} on Prescription ${i.rx+1} (${esc(vetReason(i))})`).join('; ')}.`:' Every item meets the payer rules.'}</p>
    <p>${recTxt(added,'Added to this order:')||''}${added.length&&left.length?' ':''}${left.length?recTxt(left,added.length?'Still suggested:':'Also worth considering for this patient:'):''}</p>
    <div class="m-foot">AI generated from this patient's documents. Review before dispensing.</div></section>`;
}
const recRow=r=>{const on=RECSET.has(r.id);return `<div class="rec-i"><div class="rec-m"><b>${esc(r.name)}</b>${r.code?` <span class="muted">${r.code}</span>`:''}<div class="rec-w">${esc(r.why)}</div></div><span class="rec-c ${r.cov==='ok'?'ok':'chk'}">${r.cov==='ok'?'Usually covered':'Check coverage'}</span><button class="btn secondary sm" data-rec="${r.id}" aria-pressed="${on}">${on?ic('check')+' Added':'Add'}</button></div>`;};
