<body class="ms-Fabric intake-page precheck-page">
  <header class="shell-ribbon" aria-label="Signetic">

  </header>

  <nav class="shell-nav" id="shellNav" aria-label="Main navigation">
    <button class="nav-toggle" id="navToggle" aria-label="Collapse navigation" aria-expanded="true" title="Collapse navigation"><i data-lucide="menu"></i></button>
    <div class="nav-scroll">
      <a class="nav-item" href="index.html" title="Home"><i data-lucide="house"></i><span>Home</span></a>
      <button class="nav-item" title="Recent"><i data-lucide="clock"></i><span>Recent</span><i class="nav-chevron" data-lucide="chevron-down"></i></button>

      <div class="nav-group"><button class="nav-section" aria-expanded="false" data-nav-section><span>Practice Management</span><i class="nav-chevron" data-lucide="chevron-down"></i></button>
        <div class="nav-children"><a class="nav-item" href="index.html" title="Patients"><i data-lucide="users"></i><span>Patients</span></a></div>

      <div class="nav-group open"><button class="nav-section" aria-expanded="true" data-nav-section><span>DME</span><i class="nav-chevron" data-lucide="chevron-down"></i></button>

  <div class="app-body">
    <main class="pq-page pq-layout" id="pqLayout">
      <div class="pr-main">
        <header class="pr-top">
          <div class="pr-title"><span class="ai-label"><i data-lucide="sparkles"></i> AI coverage pre-check</span><p class="pk-sub" id="pkPatient"></p></div>
          <p class="pk-disclaimer"><i data-lucide="info"></i> Decision support only. It doesn’t guarantee coverage, payment or reimbursement. The provider makes the final determination before dispensing.</p>
        </header>
        <div class="pr-body">
          <nav class="pr-list-col" aria-label="Prescriptions and HCPCS codes"><div class="pr-list" id="prList"></div></nav>
          <section class="pr-right">
            <div class="pr-detail" id="prDetail" aria-live="polite" tabindex="-1"></div>
            <footer class="pr-footer">
              <div class="pk-footer-status" id="pkFooterStatus" aria-live="polite"></div>
              <div class="pk-footer-actions">
                                <button class="footer-btn primary" id="pcCreateOrder">Create order <i data-lucide="arrow-right"></i></button>
              </div>
            </footer>
          </section>
        </div>
      </div>
    </main>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
